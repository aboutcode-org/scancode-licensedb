  \ aggregate liability for all claims arising out of or in connection with the Terms or the\
  \ AlphaGenome Assets, including for its own negligence, is limited to $500.\n\n10. Miscellaneous\n\
  \nBy law, you have certain rights that cannot be limited by a contract like the Terms. The\
  \ Terms are in no way intended to restrict those rights.\n\nThe Terms are our entire agreement\
  \ relating to your use of the AlphaGenome Assets and supersede any prior or contemporaneous\
  \ agreements on that subject.\n\nIf it turns out that a particular provision of the Terms\
  \ is not enforceable, the balance of the Terms will remain in full force and effect.\n\n11.\
  \ Disputes\n\nCalifornia law will govern all disputes arising out of or relating to the Terms\
  \ or in connection to the AlphaGenome Assets. These disputes will be resolved exclusively\
  \ in the federal or state courts of Santa Clara County, California, USA and you and Google\
  \ consent to personal jurisdiction in those courts. To the extent that applicable local law\
  \ prevents certain disputes from being resolved in a California court, you and Google can\
  \ file those disputes in your local courts. If applicable local law prevents your local court\
  \ from applying California law to resolve these disputes, then these disputes will be governed\
  \ by the applicable local laws of your country, state, or other place of residence. If you\
  \ are using the AlphaGenome Assets on behalf of a government organization other than US federal\
  \ government organizations (where the foregoing provisions shall apply to the extent permitted\
  \ by federal law), these Terms will be silent regarding governing law and courts.\n\nGiven\
  \ the nature of scientific research, it may take some time for any breach of the Terms to\
  \ become apparent. To protect you, Google and the AlphaGenome Assets, to the extent allowed\
  \ by applicable law you agree that:\n\n    any legal claims relating to the Terms or the AlphaGenome\
  \ Assets can be initiated until the later of:\n        the cut-off date under applicable law\
  \ for bringing the legal claim; or\n        two years from the date you or Google (as applicable)\
  \ became aware, or should reasonably have become aware, of the facts giving rise to that claim;\
  \ and\n    you will not argue limitation, time bar, delay, waiver, or the like in an attempt\
  \ to bar an action filed within that time period, and neither will Google.\n\nAll rights not\
  \ specifically and expressly granted to you by the Terms are reserved to Google. No delay,\
  \ act or omission by Google in exercising any right or remedy will be deemed a waiver of any\
  \ breach of the Terms and Google expressly reserves any and all rights and remedies available\
  \ under the Terms or at law or in equity or otherwise, including the remedy of injunctive\
  \ relief against any threatened or actual breach of the Terms without the necessity of proving\
  \ actual damages."
