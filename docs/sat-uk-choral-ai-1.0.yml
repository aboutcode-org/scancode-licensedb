  \ provision of service to you, or with our prior written consent and then, in each case, only\
  \ for the Permitted Purposes and subject to the Conditions and Prohibitions.\n\nYou must,\
  \ in particular, ensure that the provisions of any technical services provider contracts and\
  \ licences are consistent with this Agreement.\n\n\n## PERMITTED ACTS\nThe “Permitted Acts”\
  \ are:\n- storing and copying the Datasets;\n- combining the Datasets, in whole or part, with\
