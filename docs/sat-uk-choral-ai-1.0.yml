  \ independently from the Datasets; and\n- you must not use the Datasets or any AI Model in\
  \ any way that is unlawful or illegal, for any unlawful or illegal purpose, or in connection\
  \ with any unlawful or illegal purpose or activity. \n\n\n## TERM AND TERMINATION\nThis Agreement\
  \ shall automatically terminate at the end of the Licence Period.\n\nThis Agreement shall\
