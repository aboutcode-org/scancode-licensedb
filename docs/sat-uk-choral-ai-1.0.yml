  \ purposes;\n- educational, academic or research purposes; or\n- private and domestic purposes.\n\
  \nIf you wish to use the Datasets for any other purpose (including for any commercial purpose),\
  \ you must send to us a written request seeking permission, including details of that purpose\
  \ and of the persons that will be involved. We may either grant or withhold such permission,\
  \ and we may apply conditions to any grant of permission. \n\n\n## CONDITIONS\nThe licence\
  \ we grant to you is subject to these conditions (the “Conditions”):\n- you must store, access\
  \ and use the Datasets securely;\n- you must ensure that the Datasets are not stored in, or\
