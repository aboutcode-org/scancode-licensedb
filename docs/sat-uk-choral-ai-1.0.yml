  \ Agreement, “Datasets” shall include datasets that incorporate the Datasets in whole or part,\
  \ whether created by you or a third party.  Machine learning models trained in whole or in\
  \ part using the Datasets are referred to in this Agreement as the “AI Models”.\n\n\n## LICENCE\n\
