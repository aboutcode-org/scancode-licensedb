  \ The Serpentine Trust, a copy of which is available at [URL]; \n- you must include in all\
  \ public uses of the Datasets an attribution, in the form specified in the code of conduct\
  \ or in such alternative form(s) as we may have agreed with you in writing; and\n- you must\
  \ make any AI Model that you publish or distribute available to all recipients under a Creative\
